name: ci
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install (CPU)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy numba h5py hdf5plugin opencv-python-headless imageio pyyaml \
                      matplotlib onnx onnxruntime pytest ruff
          pip install -e . --no-deps
      - run: ruff check src tests scripts
      - run: pytest -q
      - run: python scripts/make_tables.py --check   # make reproduce-tables (checklist G6)
