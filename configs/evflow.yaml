# Global defaults for event-maritime-flow. Draft — values marked TODO are fixed at the phase noted.
project: event-maritime-flow
split_seed: 20261008
seeds_core: [1337, 2026, 7]          # real_sup, v2e_fixed_sup, v2e_rand_sup
seed_default: 1337

event_store:
  time_unit: us                       # int64
  polarity: {off: 0, on: 1}
  compression: blosc                  # via hdf5plugin

windows:
  mvsec: {dt_frames: [1, 4]}          # windows = APS frame intervals
  dsec: {delta_t_ms: 100}             # DSEC-Flow convention
  maritime: {dt_frames: [1]}          # LaRS: px per frame interval (rate-free)

representations:
  default: voxel
  voxel: {bins: [5, 15], normalize: nonzero_mean_std}
  timesurface: {tau_fraction_of_window: 0.333}
  count: {}

model_m1:
  name: evflownet
  base_channels: 32                   # 13.3 M params (tests/test_evflownet.py, D-043)
  crop: [256, 256]
  pad_multiple: 16

train:
  optimizer: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  schedule: cosine
  epochs: 40                          # selection = best tune epoch, so no plateau hand-pick (D-043)
  batch_size: 16
  precision: bf16
  grad_clip: 1.0
  num_workers: 6
  augment: {random_crop: true, hflip: true, polarity_flip: false}
  selection_split: mvsec_tune         # never a test split
  dts: [1, 4]                         # one model for both MVSEC window lengths (D-043)
  dt_fractions: {1: 0.5, 4: 0.5}
  epoch_samples: dt1_windows          # one epoch = as many samples as dt=1 train windows
  warmup_windows: 10                  # first windows of each clip dropped, every arm (D-032c)
  hood_row: 192                       # rows >= 192 (outdoor car hood): no supervision, no CM events
  representation: voxel5              # main arms; ablation adds voxel15, timesurface, count
  tune_diag_windows: 200              # evenly spaced tune dt=1 windows for collapse diagnostics
  tune_region: center_256_no_hood     # configs/eval_mvsec.yaml regions (outdoor protocol)
  smoke: {n_windows: 8, max_steps: 4000, check_every: 50, target_epe: 0.1, lr: 1.0e-3}

losses:
  supervised: {type: l1_epe, mask: valid_gt, scale_weights: [0.125, 0.25, 0.5, 1.0]}  # coarse→fine
  cm:
    objective: average_timestamp      # D-047 (iwe_variance collapsed on real MVSEC)
    reference_times: [0.0, 0.5, 1.0]  # multi-reference IWE (collapse guard)
    smoothness_weight: 0.1            # default; chosen on tune by the CM sweep (D-044)
    divergence_penalty: 1.0           # collapse guard; >= 0.3 needed on the fixture (D-043); sweep D-044
    blur_sigma: 1.0
    pad_px: 64
    max_events: 100000
    sweep: {smoothness_weight: [0.1, 0.5], divergence_penalty: [0.3, 1.0], epochs: 10}

metrics:
  outlier: {abs_px: 3.0, rel: 0.05}   # %Out: EPE > 3 px AND > 5 % of |GT|
  npe: [1, 2, 3]
  fwl: {zero_flow_reference: true}
  teacher:
    model: raft_large
    fb_consistency: {alpha1: 0.01, alpha2: 0.5}
  bootstrap: {resamples: 1000, block_seconds: 1.0, ci: 0.95}

latency:                              # Phase 8 step 3 (scripts/latency_bench.py, D-063)
  warmup: 50
  timed: 500
  events_per_window: [10000, 100000, 1000000]
  resolutions: [[256, 256], [260, 346], [480, 640]]   # network H, W before zero-padding to /16
  representation: voxel5              # the exported arm's input
  rep_resolutions: [[260, 346], [480, 640]]           # representation build H, W
  end_to_end_resolution: [260, 346]   # MVSEC sensor
  synthetic_window_us: 30000          # synthetic events: uniform x/y/p, sorted uniform t, seeded
  seed: 1337

export:                               # Phase 8 steps 1-2 (scripts/export_onnx.py, onnx_parity.py)
  # Checkpoints fixed by a tune-only rule (D-063): primary = lowest real mvsec_tune dt1 EPE of
  # all runs; second = lowest v2e-stream mvsec_tune dt1 EPE among the v2e arms. Latency uses the
  # primary (every voxel5 run has the same architecture).
  runs: [real_sup_voxel5_s1337, v2e_rand_sup_voxel5_s7]
  opset: 17
  pad_multiple: 16
  parity:
    split: mvsec_test
    dt: 1
    sequences: [indoor_flying1, indoor_flying2, indoor_flying3, outdoor_day1]
    # 50 per sequence = 200 windows, evenly spaced over each unit's window list
    # (np.unique(np.linspace(0, n - 1, k).round()), as train/tune_eval._subset); fixed before
    # any ONNX output was produced.
    windows_per_sequence: 50
    tolerances: {fp32_max_px: 1.0e-3, fp16_max_px: 5.0e-2, epe_change_px: 0.01}
    providers:                        # (label, ORT provider, precision)
      - [ort_cuda_fp32, CUDAExecutionProvider, fp32]
      - [ort_cuda_fp16, CUDAExecutionProvider, fp16]
      - [ort_trt_fp16, TensorrtExecutionProvider, fp16]

figures:                              # scripts/make_figures.py (Phase 6 step 3, D-051)
  # Flow panels: windows fixed by position in each test unit's window list, chosen before any
  # prediction was viewed (no cherry-picking); dt = 1; models = seed-1337 runs of these arms.
  panel_windows:
    - {sequence: indoor_flying1, position: 0.5}
    - {sequence: indoor_flying2, position: 0.5}
    - {sequence: indoor_flying3, position: 0.5}
    - {sequence: outdoor_day1, position: 0.25}
    - {sequence: outdoor_day1, position: 0.5}
    - {sequence: outdoor_day1, position: 0.75}
  panel_dt: 1
  panel_runs: [real_sup_voxel5_s1337, v2e_fixed_sup_voxel5_s1337]
  attribution: >-
    MVSEC (Zhu et al., RA-L 2018), CC BY-SA 4.0; derived panels are shared under the same licence.
