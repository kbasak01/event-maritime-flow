# Phase 5 training arm `real_sup` (IMPLEMENTATION_PLAN §1.4): real DVS events, MVSEC GT flow.
# Every MVSEC arm trains on the same mvsec_train windows (D-026 clips, D-032c warm-up drop, D-043).
inherit: configs/evflow.yaml
arm: real_sup
events:
  train: real               # real | train_cal | rand (src/evflow/train/data.py)
  tune_select: real         # tune stream that selects the epoch (mvsec_tune only; D-043)
  tune_log: []              # logged for the diagnostician, never used for a choice
loss: supervised
selection: {split: mvsec_tune, metric: epe, mode: min, dt: 1}
