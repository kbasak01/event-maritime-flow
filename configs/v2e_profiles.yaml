# v2e argument profiles (IMPLEMENTATION_PLAN §1.7). Read only by src/evflow/sim/v2e_runner.py.
# argv = common + profile size + profile args (+ grid overrides) + run flags set by the runner:
#   --input --output_folder --dvs_h5 --dvs_emulator_seed --input_frame_rate [--start_time --stop_time]
# args are {flag: value}; a null value is a flag without a value. A child profile (`base:`) replaces
# `size` and updates `args`. Overrides may only change flags the profile already sets.
# mvsec_cal / mvsec_rand are frozen from calibration_json (mvsec_tune ONLY; Phase 2, re-frozen D-035)
# by scripts/freeze_profile.py — never edit those values by hand.
v2e_commit_file: configs/v2e_commit.txt
calibration_json: results/v2e_calibration_timing.json
calibration_sha256: 095d9d858b51679b9b9c0cf8693881bd68876bfe7c737531dac0e2e0400b6fb4      # written by scripts/freeze_profile.py
# Phase 3 alignment check: count-image NCC median must exceed this (rule D-029, re-derived on
# mvsec_tune for the timing-constrained profile, D-035)
alignment_ncc_threshold: 0.491063   # written by scripts/freeze_profile.py

common:
  - --no_preview
  - --skip_video_output
  - --overwrite

lars:
  assumed_fps: 30             # no frame rate is documented by LaRS (D-024)
  assumed_fps_decision: "D-024: 30 fps assumed; LaRS median inter-frame motion 0.66 px vs SMD@30fps 1.24 px"

profiles:
  trial:                      # 5 s smoke, never used for data
    allow_dvs_params: true
    size: [--dvs346]
    args:
      --dvs_params: clean
      --auto_timestamp_resolution: "True"
      --timestamp_resolution: "0.001"

  # Nominal pixel model for the throughput sweep and the calibration grid: the grid overrides the
  # four calibrated flags; everything else is pinned here (v2e defaults written out explicitly).
  mvsec_grid:
    size: [--dvs346]
    args:
      --auto_timestamp_resolution: "True"
      --timestamp_resolution: "0.00075"   # cap: coarsest passing the 60 Hz lowpass check (D-025)
      --pos_thres: "0.2"
      --neg_thres: "0.2"
      --sigma_thres: "0.03"
      --cutoff_hz: "60"
      --shot_noise_rate_hz: "0"
      --leak_rate_hz: "0"
      --refractory_period: "0.0005"
      --batch_size: "8"              # SuperSloMo batch (speed only; checked in the sweep)

  mvsec_cal:                  # frozen from the calibration argmin (scripts/freeze_profile.py)
    base: mvsec_grid
    args: {--pos_thres: "0.6", --neg_thres: "0.6", --sigma_thres: "0.04", --cutoff_hz: "0.0", --shot_noise_rate_hz: "0.0"}

  mvsec_rand:                 # CT randomised per 60 s clip; range from calibration (tune only)
    base: mvsec_cal
    randomise:
      thres_range: [0.4, 0.78]   # pos_thres = neg_thres drawn log-uniform
      sigma_range: [0.02, 0.052]   # sigma_thres drawn uniform
      corpora: 4

  maritime_640x360:
    base: mvsec_cal           # same pixel model, different size
    size: [--output_width, "640", --output_height, "360"]
    ct_variants: [0.67, 1.0, 1.5]   # multipliers on calibrated thresholds (clutter study)

  maritime_346x260:           # throughput comparison only
    base: mvsec_cal
    size: [--output_width, "346", --output_height, "260"]

calibration_grid:             # Phase 2, on mvsec_tune only (src/evflow/sim/calibrate.py)
  pos_neg_thres: [0.15, 0.2, 0.3, 0.4]
  sigma_thres: [0.02, 0.04]
  cutoff_hz: [0, 60]
  shot_noise_rate_hz: [0, 1.0]
  objective: mean_wasserstein1_event_stats   # mean over stats of W1 / std(real) (D-027)
  profile: mvsec_grid
  seed: 1337                  # same emulator seed in every cell (common random numbers)
  segments: {n: 3, n_frames: 175}   # 3 x 4.0 s evenly spaced inside mvsec_tune (D-028)
  warmup_frames: 10           # first APS windows of each segment excluded (v2e state settling)
  block_ms: 500               # blocks for per-pixel rate and hot-pixel fraction
  rand_rule: {factor: 1.5, min_halfwidth: 0.3}   # plan Phase 2 step 3
  ncc_rule: {fraction: 0.75, blur_sigma_px: 1.0, control_shift_frames: 5}   # + x-mirror control (D-029)

calibration_grid_timing:      # Phase 3 re-calibration (D-035), on mvsec_tune only
  base: calibration_grid      # same segments, seed, warm-up, blocks, objective, rand/ncc rules
  cell_prefix: t
  pos_neg_thres: [0.4, 0.5, 0.6, 0.7]
  sigma_thres: [0.02, 0.04]
  cutoff_hz: [0]              # lowpass off: at the 0.75 ms cap only cutoff <= ~64 Hz passes v2e's
                              # check, and every such cutoff delays events (60 Hz: +0.5 frame)
  shot_noise_rate_hz: [0, 1.0]
  lag_rule: {max_abs_peak_lag_frames: 0.125}   # eligible: tune NCC-vs-lag peak within 1/8 frame
